# msnap configuration file
#
# Default precedence (highest to lowest):
# 1. CLI arguments (--output-dir, etc.)
# 2. Config file values (if not set below)
# 3. XDG environment variables (XDG_PICTURES_DIR, XDG_VIDEOS_DIR)
# 4. Hardcoded defaults in source code
#
# Leave values empty to use defaults from precedence chain above.

# Screenshot settings
# Output directory (default: $XDG_PICTURES_DIR/Screenshots or ~/Pictures/Screenshots)
shot_output_dir=~/Pictures/Screenshots
# Filename strftime pattern (default: %Y%m%d%H%M%S.png)
shot_filename_pattern=screenshot_%Y%m%d_%H%M%S.png
# Show pointer in screenshots | true, false | default: false
shot_pointer_default=false

# Screencast settings
# Output directory (default: $XDG_VIDEOS_DIR/Screencasts or ~/Videos/Screencasts)
cast_output_dir=~/Videos/Screencasts
# Filename strftime pattern (default: %Y%m%d%H%M%S.mp4)
cast_filename_pattern=screencast_%Y%m%d_%H%M%S.mp4
# Video/encoding settings (leave empty for gpu-screen-recorder defaults)
# Quality preset | medium, high, very_high, ultra | default: very_high
cast_quality=ultra
# Video codec | h264, hevc, av1, vp8, vp9 | default: h264
cast_codec=h264
# Target frame rate | numeric | default: 60
cast_framerate=60
# Audio codec | opus, aac | default: opus
cast_audio_codec=opus
# Color range | limited, full | default: limited
cast_color_range=full
# Show cursor in recording | true, false | default: true
cast_cursor=false
# Output resolution cap (e.g. 1920x1080) | default: no cap (original)
cast_resolution=no cap
# Container format | mp4, mkv, webm | default: inferred from filename extension
cast_container=mp4
# Encoding tune | performance, quality | default: performance
cast_tune=quality
