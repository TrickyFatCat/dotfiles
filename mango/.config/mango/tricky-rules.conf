# -----------------------
# TERMINALS
# -----------------------
# Foot
window_rule=app_id:foot,is_term:1,

# -----------------------
# UTILITY
# -----------------------
# GitRepos Explorer
window_rule=app_id:Explorer,title:GitRepos,is_floating:1,width:0.5,height:0.5,is_overlay:1,is_global:1

# Configs Explorer
window_rule=app_id:Explorer,title:Configs,is_floating:1,width:0.5,height:0.5,is_overlay:1,is_global:1

# Layout Switcher
window_rule=app_id:Picker,title:Layout,is_floating:1,width:0.12,height:0.4,is_overlay:1

# -----------------------
# APPS
# -----------------------
# Zen Browser
window_rule=app_id:zen,unfocused_opacity:1.0,tags:1

# Zen PnP
window_rule=app_id:zen,title:Picture-in-Picture,is_floating:1,is_overlay:1,width:0.3,height:0.3,no_force_center:1,offset_x:100,offset_y:100,is_unmanaged_global:1

# MPV
window_rule=app_id:mpv,unfocused_opacity:1.0,tags:3,is_fullscreen:1

# Swayimg
window_rule=app_id:swayimg,unfocused_opacity:1.0

# Telegram
window_rule=app_id:org.telegram.desktop,tags:2

# Vesktop
window_rule=app_id:vesktop,tags:2

# Concord
window_rule=title:concord,tags:2

# System Monitor
window_rule=title:System Monitor,is_floating:1,width:0.5,height:0.75,centerwin

# Satty
window_rule=app_id:com.gabm.satty,is_floating:1

# Selector
window_rule=app_id:xdg-desktop-portal-gtk,is_floating:1,centerwin,is_overlay:1

# Localsend
window_rule=app_id:localsend,is_floating:1,is_global:1,width:0.3,height:0.6

# -----------------------
# NAMED SCRATCHPADS
# -----------------------
# Terminal Scratchpad
window_rule=app_id:scratch.term,is_named_scratchpad:1,width:0.5,height:0.75

# Notes Scratchpad
window_rule=app_id:scratchpad,title:Notes,is_named_scratchpad:1,width:0.47,height:0.70

# Music Scratchpad
window_rule=app_id:scratch.music,is_named_scratchpad:1,width:0.4,height:0.4,offset_x:100,offset_y:-100

# Files Scratchpad
window_rule=app_id:Nautilus,is_named_scratchpad:1,width:0.3,height:0.5,offset_x:100,offset_y:100

# ToDo Scratchpad
window_rule=app_id:scratch.todo,is_named_scratchpad:1,width:0.6,height:0.70
