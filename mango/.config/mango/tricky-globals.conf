# ---------------------------
# AUTOSTART SCRIPTS
# ---------------------------
# Convenience script. Automatically switches to Tag 1 if current tag is empty
# Pretty convenient if you close all the windows in current tag
exec-once=nu ~/.config/mango/shell-scripts/autotag.nu

# ---------------------------
# TAGS
# ---------------------------
# How many workspaces/tags are available.
# Range: 1–31
tag_num=9

# Compact tags to remove gaps after windows leave tags
# For example, with windows on tags 1, 3 and 9
# They move to 1, 2 and 3, and the current view follows
tag_gather=0

# Tags wrap around in a carousel
# Navigating past the last tag goes back to the first, and vice versa
# 0: False
# 1: True
tag_carousel=1

# When you try to view the currently active tag
# It sends the current view to the background and switches to the previous tag
# 0: False
# 1: True
view_current_to_back=1

# ---------------------------
# SCRATCHPAD
# ---------------------------
# Only one scratchpad window exists at a time
# Opening a new one hides the previous
# 0: False
# 1: True
single_scratchpad=0

# Scratchpad windows can be shown on any monitor
# Not just the one they were moved from
# 0: False
# 1: True
scratchpad_cross_monitor=0

# WARNING: Works only for normal scratchpad
# Does NOT work for named scratchpads

# Width ratio
scratchpad_width_ratio=0.6

# Height ratio
scratchpad_height_ratio=0.8

# ---------------------------
# CURSOR
# ---------------------------
# Auto-hide the cursor after this many seconds of inactivity
# Set to 0 to never auto-hide
# Mango range: 0–36000
cursor_hide_timeout=5000

# Automatically hide the cursor whenever any keyboard key is pressed
# The cursor reappears on mouse movement
# 0: False
# 1: True
cursor_hide_on_keypress=1

# Teleport the cursor to the centre of the newly focused window
# 0: False
# 1: True
warpcursor=1

# Move the cursor to the resize corner when initiating a mouse drag resize
# 0: False
# 1: True
drag_warp_cursor=1

# ---------------------------
# FOCUS
# ---------------------------
# Automatically focus windows when they request activation
# 0: False
# 1: True
focus_on_activate=1

# Focus follows the mouse cursor
# 0: False
# 1: True
sloppyfocus=1

# Allow directional focus changes (focusdir, focusstack) to move between monitors
# 0: False
# 1: True
focus_cross_monitor=0

# Allow swapping window positions between different monitors
# 0: False
# 1: True
exchange_cross_monitor=0

# Allow focus to move between windows on different tags
# 0: False
# 1: True
focus_cross_tag=0

# ---------------------------
# SECURITY
# ---------------------------
# Permit transparent or translucent lockscreen surfaces
# Disable to enforce fully opaque lockscreens for privacy and security
# 0: False
# 1: True
allow_lock_transparent=1

# When enabled
# Applications (games, VMs, remote desktop) can request the compositor to suspend keybindings
# So all key events reach the app
# 0: False
# 1: True
allow_shortcuts_inhibit=1

# ---------------------------
# IDLE
# ---------------------------
# Only fullscreen windows may inhibit the idle inhibitor (DPMS/screen blanking)
# Requests from tiled or floating windows are ignored
# 0: False
# 1: True
idleinhibit_ignore_visible=0

# ---------------------------
# DRAG
# ---------------------------
# Default corner used when resizing floating windows with the mouse
# Auto picks the corner nearest to the cursor
# Corner for drag-to-tile detection (0: none, 1–3: corners, 4: auto-detect).
# 0: Top-left
# 1: Top-right
# 2: Bottom-left
# 3: Bottom-right
# 4: Auto-detect
drag_corner=3

# Allow reordering tiled windows by dragging one onto another
# When disabled, tiled windows cannot be dragged
# 0: False
# 1: True
drag_tile_to_tile=1

# When dragging a tiled window
# Shrink it to a small thumbnail so you can see the layout underneath
# 0: False
# 1: True
drag_tile_small=1

# Render refresh interval when dragging tiled windows
# Lower values = smoother but more GPU work
# Mango range: 1.0–16.0
drag_tile_refresh_interval=8.0

# Render refresh interval when dragging floating windows
# 0: Every frame
# Mango range: 0.0–1000.0
drag_floating_refresh_interval=8.0

# ---------------------------
# SNAPPING
# ---------------------------
# Snap floating windows to each other and to screen edges when moved close enough
enable_floating_snap=1

# Maximum distance in pixels for a floating window to snap
# Mango range: 0-99999
snap_distance=30
