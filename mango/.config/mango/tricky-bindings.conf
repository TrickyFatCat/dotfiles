# -----------------------
# APPS
# -----------------------
# Open Browser
bind=SUPER,b,spawn_shell,~/.config/mango/shell-scripts/open-browser.nu 

# Open Telegram
bind=SUPER+SHIFT,m,spawn_shell,~/.config/mango/shell-scripts/open-telegram.nu

# Open Terminal
bind=SUPER,Return,spawn_shell,~/.config/mango/shell-scripts/open-terminal.nu

# Open Terminal in cwd of focused terminal
bind=SUPER+SHIFT,Return,spawn_shell,~/.config/mango/shell-scripts/open-terminal.nu --cwd

# Open System Monitor
bind=SUPER,m,spawn_shell,~/.config/mango/shell-scripts/open-system-monitor.nu

# -----------------------
# UTILS
# -----------------------
# Reload config
bind=SUPER+SHIFT,r,reload_config

# Open editor in a directory of focused terminal or in home directory
bind=SUPER,e,spawn_shell, ~/.config/mango/shell-scripts/open-editor.nu

# Open GitRepos Explorer window
bind=SUPER+SHIFT,e,spawn_shell,~/.config/mango/shell-scripts/turn-on-tv.nu --class=Explorer --title=GitRepos -- explorer-gitrepos

# Open dotfiles configs
bind=SUPER+SHIFT,c,spawn_shell,~/.config/mango/shell-scripts/turn-on-tv.nu --class=Explorer --title="Configs" -- explorer-configs

# -----------------------
# WINDOWS
# -----------------------
# Close window
bind=SUPER,q,killclient

# Toggle floating
bind=SUPER+SHIFT,space,togglefloating

# Toggle global
bind=SUPER,g,toggleglobal

# Toggle maximise screen
bind=SUPER,f,togglemaximizescreen

# Toggle fullscreen
bind=SUPER+SHIFT,f,togglefullscreen

# Toggle fake fullscreen
bind=SUPER+ALT,f,togglefakefullscreen

# -----------------------
# FOCUS NAVIGATION
# -----------------------
# Focus next window
bind=SUPER,Tab,focusstack,next

# Focus previuos window
bind=SUPER+SHIFT,Tab,focusstack,prev

# Focus window left
bind=SUPER,Left,focusdir,left
bind=SUPER,H,focusdir,left

# Focus window right
bind=SUPER,Right,focusdir,right
bind=SUPER,L,focusdir,right

# Focus window up
bind=SUPER,Up,focusdir,up
bind=SUPER,K,focusdir,up

# Focus window down
bind=SUPER,Down,focusdir,down
bind=SUPER,J,focusdir,down

# -----------------------
# WINDOW MOVEMENT
# -----------------------
# Move window left
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,H,exchange_client,left

# Move window right
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,L,exchange_client,right

# Move window up
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,K,exchange_client,up

# Move window down
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,J,exchange_client,down

# Exchange window position in stack
# Next Window
# bind=SUPER+ALT,Left,exchange_stack_client,next

# Exchange window position in stack
# Previous Window
# bind=SUPER+ALT,Right,exchange_stack_client,previuos

# Swap focused window with Master
bind=SUPER,Z,zoom

# Move focused window to tag 1
bind=SUPER+SHIFT,1,tag,1

# Move focused window to tag 2
bind=SUPER+SHIFT,2,tag,2

# Move focused window to tag 3
bind=SUPER+SHIFT,3,tag,3

# Move focused window to tag 4
bind=SUPER+SHIFT,4,tag,4

# Move focused window to tag 5
bind=SUPER+SHIFT,5,tag,5

# Move focused window to tag 6
bind=SUPER+SHIFT,6,tag,6

# Move focused window to tag 7
bind=SUPER+SHIFT,7,tag,7

# Move focused window to tag 8
bind=SUPER+SHIFT,8,tag,8

# Move focused window to tag 9
bind=SUPER+SHIFT,9,tag,9

# -----------------------
# GROUPS
# -----------------------
# Join group on the left
bind=SUPER+CTRL,left,groupjoin,left
bind=SUPER+CTRL,H,groupjoin,left

# Join group on the right
bind=SUPER+CTRL,Right,groupjoin,right
bind=SUPER+CTRL,L,groupjoin,right

# Join group up
bind=SUPER+CTRL,Up,groupjoin,up
bind=SUPER+CTRL,K,groupjoin,up

# Join group down
bind=SUPER+CTRL,Down,groupjoin,down
bind=SUPER+CTRL,J,groupjoin,down

# Focus next group member
bind=SUPER+CTRL,tab,groupfocus,next

# Focus previous group member
bind=SUPER+CTRL+SHIFT,tab,groupfocus,prev

# Leave group
bind=SUPER+CTRL,G,groupleave

# -----------------------
# OVERVIEW
# -----------------------
# Enter jump overview
bind=SUPER,o,togglejump

# Enter jump overview
bind=ALT,tab,togglejump

# -----------------------
# TAGS
# -----------------------
# Go to tag 1
bind=SUPER,1,view,1

# Go to tag 2
bind=SUPER,2,view,2

# Go to tag 3
bind=SUPER,3,view,3

# Go to tag 4
bind=SUPER,4,view,4

# Go to tag 5
bind=SUPER,5,view,5

# Go to tag 6
bind=SUPER,6,view,6

# Go to tag 7
bind=SUPER,7,view,7

# Go to tag 8
bind=SUPER,8,view,8

# Go to tag 9
bind=SUPER,9,view,9

# -----------------------
# LAYOUTS
# -----------------------
# Switch proportion preset for scroller
bind=SUPER+SHIFT,p,switch_proportion_preset

# -----------------------
# SCRATCHPADS
# -----------------------
# Send currenrt window to the scratchpad
bind=SUPER,i,minimized

# Toggle (show/hide) the scratchpad
bind=ALT,z,toggle_scratchpad

# Retrieve window from scratchpad
bind=SUPER+SHIFT,i,restore_minimized

# Open Terminal Scratchpad
bind=SUPER,t,toggle_named_scratchpad,scratch.term,none,~/.config/mango/shell-scripts/open-scratch-terminal.nu

# Open Notes Scratchpad
bind=SUPER,n,toggle_named_scratchpad,none,Notes,~/.config/mango/shell-scripts/open-notes.nu

# Open Music Scratchpad
# Requires cliamp
bind=SUPER+ALT,m,toggle_named_scratchpad,scratch.music,none,~/.config/mango/shell-scripts/open-cliamp.nu

# -----------------------
# SYSTEM CONTROL
# -----------------------
# Shell agnostic bindingis

#===BRIGHTNESS===
# Requires brightnessctl

# Increas brightness by 5%
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +5%

# Decrease brightness by 5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 5%-

# Set brightness to 100%
bind=SHIFT,XF86MonBrightnessUp,spawn,brightnessctl s 100%

# Set brightness to 1%
bind=SHIFT,XF86MonBrightnessDown,spawn,brightnessctl s 1%

#===SOUND VOLUME===
# Requires wpctl (WirePlumber)

# Increase volume by 5%
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+

# Decrease volume by 5%
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-

# Mute sound 
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle

#===MICROPHONE===
# Requires wpctl (WirePlumber)

# Increase mic volume by 5%
bind=SHIFT,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SOURCE@ 5%+

# Decrease mic volume by 5%
bind=SHIFT,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SOURCE@ 5%-

# Mute microphone
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

#===MEDIA PLAYBACK===
# Requires playerctl

# Play next
bind=NONE,XF86AudioNext,spawn,playerctl next

# Play previous
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# Play/Pause
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause

# Stop
bind=NONE,XF86AudioStop,spawn,playerctl stop

# -----------------------
# SCREEN CAPTURE
# -----------------------
# Requires msnap
# Open Screenshot GUI
bind=none,Print,spawn_shell,~/.config/mango/shell-scripts/take-screenshot.nu gui

# Screenshot: Focused Window
bind=ALT,Print,spawn_shell,~/.config/mango/shell-scripts/take-screenshot.nu -- shot --window

# Screenshot: Screen
bind=CTRL,Print,spawn_shell,~/.config/mango/shell-scripts/take-screenshot.nu -- shot

