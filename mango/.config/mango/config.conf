env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

source=./tricky-globals.conf
source=./tricky-inputs.conf
source=./tricky-appearance.conf
source=./tricky-effects.conf
source=./tricky-animations.conf
source=./tricky-layouts.conf
source=./tricky-tags.conf
source=./tricky-bindings.conf
source=./tricky-overview.conf
source=./tricky-rules.conf

# exec-once runs only at startup. Do NOT use exec= for the shell: mango re-runs
# every exec= on each config reload, and DMS reloads the config, which would
# spawn a new shell on every reload.
exec-once=noctalia


source=~/.config/mango/noctalia.conf
