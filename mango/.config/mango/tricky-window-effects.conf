# ---------------------------
# OPACITY
# ---------------------------
# Make separate window rules keep windows opaque
focused_opacity = 1.0
unfocused_opacity = 0.75

# ---------------------------
# BLUR
# ---------------------------

# Enable/Disable Blur
blur=1

# Enable/Disable Blur for layer surfaces (bars/docks)
blur_layer=0

# Caches the wallpaper and blur background, significantly reducing GPU usage.
# Disabling it will significantly increase GPU consumption and may cause rendering lag.
# Highly recommended.
blur_optmized=1

# The strength (radius) of the blur
blur_params_radius=5

# Number of passes. Higher = smoother but more expensive
blur_params_num_passes=2

# Blur noise level
blur_params_noise=0.02

# Blur brightness adjustment
blur_params_brightness=0.9

# Blur contrast adjustment
blur_params_contrast=0.9

# Blur saturation adjustment
blur_params_saturation=1.2
# ---------------------------
# SHADOWS
# ---------------------------
# Enable/Disable shadows
shadows=0

# Enable/Disable layer shadows (panel/docks)
layer_shadows=0

# Only draw shadows for floating windows (saves performance)
shadow_only_floating=1

# Size of the shadow
shadows_size=10

# Shadow blur amount
shadows_blur=15

# Shadow offset X
shadows_position_x=0

# Shadow offset Y
shadows_position_y=0

# Color of the shadow
shadowscolor=0x000000ff

# ---------------------------
# ANIMATIONS
# ---------------------------
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1

animation_duration_open=400
animation_duration_close=300

zoom_initial_ratio=0.3
zoom_end_ratio=0.8

tag_animation_direction=0

