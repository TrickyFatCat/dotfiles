# Zen Browser
windowrule=appid:mpv,unfocused_opacity:1.0,tags:1

# Zen PnP
windowrule=appid:zen,title:Picture-in-Picture,isfloating:1,width:0.3,height:0.3,no_force_center:1,offsetx:100,offsety:100

# MPV
windowrule=appid:mpv,unfocused_opacity:1.0,tags:3,isfullscreen:1

# Terminal Scratchpad
windowrule=appid:scratch-term,isnamedscratchpad:1,width:0.5,height:0.75

# Notes Scratchpad
windowrule=appid:notes-scratch,isnamedscratchpad:1,width:0.5,height:0.75

# Swayimg
windowrule=appid:swayimg,unfocused_opacity:1.0

