# Zen Browser
windowrule=unfocused_opacity:1.0, tags:1, appid:zen

# Zen PnP
windowrule=appid:zen,title:Picture-in-Picture,isfloating:1,width:0.3,height:0.3,no_forces-center:1,offsetx:100,offsety:100

# MPV
windowrule=unfocused_opacity:1.0, tags:3, isfullscreen:1, appid:mpv

# Terminal Scratchpad
windowrule=isnamedscratchpad:1,width:0.5,height:0.75,appid:scratch-term

# Notes Scratchpad
windowrule=isnamedscratchpad:1,width:0.5,height:0.75,appid:notes-scratch

