# ---------------------------
# SWITCHING LAYOUTS
# ---------------------------
# A comma separated list of layouts
# Used by switch_layout
circle_layout=scroller,tile,dwindle,monocle,grid

# ---------------------------
# DEFAULT SCROLLER
# ---------------------------
# Width reserved on sides when window ratio is 1
scroller_structs=10

# Default width proportion for new windows
scroller_default_proportion=0.5

# WARNING:
# scroller_prefer_overspread,
# scroller_focus_center,
# scroller_prefer_center
# interact with each other.
# 
# Their priority order is:
# 1. scroller_prefer_overspread
# 2. scroller_focus_center
# 3. scroller_prefer_center
# 
# To ensure a lower-priority setting takes effect,
# you must set all higher-priority options to 0.

# Always center the focused window (1 = enable)
scroller_focus_center=0

# Center focused window only if it was outside the view
scroller_prefer_center=0

# Allow windows to overspread when there's extra space
scroller_prefer_overspread=1

# Focus windows even if partially off-screen
edge_scroller_pointer_focus=1

# Allow pointer focus to happen if the pointer moves at a speed greater than this value
edge_scroller_focus_allow_speed=0.0

# Default proportion for single windows in scroller. Requires scroller_ignore_proportion_single=0 to take effect
scroller_proportion_preset=0.5,0.8,1.0

# Ignore proportion adjustments for single windows
scroller_ignore_proportion_single=0

# Ignore proportion adjustments for single windows
scroller_default_proportion_single=1.0


# ---------------------------
# DEFAULT MASTER
# ---------------------------
# Applies to tile and center tile layouts
# New windows become the master window
new_is_master=1

# The split ratio between master and stack areas
default_mfact=0.55

# Number of allowed master windows
default_master=1

# Disable gaps when only one window is present
smartgaps=0

# (Center Tile) Master spreads across screen if no stack exists
center_master_overspread=0

# (Center Tile) Center master when only one stack window exists
center_when_single_stack=1


# ---------------------------
# DEFAULT DWINDLE
# ---------------------------
# Ratio used for new splits (0.05 - 0.95)
dwindle_split_ratio=0.5

# Pick the split axis from the cursor's positions inside the focused window.
# The new window appears on the cursor's side
dwindle_smart_split=0

# Side-by-side splits: where the new window goes.
# 0 = follow cursor
# 1 = right
# 2 = left
dwindle_hslit=0

# Top/Bottom splits: where the new window goes.
# 0 = follow cursor
# 1 = right
# 2 = left
dwindle_vsplit=0

# Keep the sibling's split orientation when a window is closed
dwindle_preserve_split=0

# When dragging to resize, move the split toward the cursor
# Regardless of which side was grabbed
dwindle_smart_resize=0

# Drag-to-tile drop prevew
# 1 = 2-zone preview matching dwindle_split_ratio,
# 0 = 4-quadrant preview
dwindle_drop_simple_split=1

# Manually split windows mode
dwindle_manual_split=0
