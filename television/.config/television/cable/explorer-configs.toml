[metadata]
name = "explorer-configs"
requirements = ["nu", "eza"]
description = """
A channel to select packages in ~/.dotfiles to work with.

This channel uses
1. `nushell` to show directories in dotfile packages
2. `eza` to preview directory structure.

"""

[source]
# Saved just in case
# command = '''fd -H -p -t d '\.config/[^/]+$' ~/dotfiles | lines | str trim -c '/' -r | uniq | sort | str join "\n"'''
command = '''glob ~/dotfiles/*/.config/* | where ($it | path type) == dir | where ($it | path basename) == ($it | path dirname | path dirname | path basename) | sort | str join "\n"'''
display = "{split:/:-1}"
shell = "nu"

[preview]
command = "let p = '{}'; cd ($p | path dirname); eza -a -T -L 3 --git-ignore --color always --icons always ($p | path basename)"
shell = "nu"

[ui.remote_control]
disabled = true

[ui.preview_panel]
size = 50

[keybindings]
tab = "select_next_entry"
backtab = "select_prev_entry"
ctrl-j = "select_next_entry"
ctrl-k = "select_prev_entry"
q = "quit"
enter = "actions:edit"
ctrl-e = "actions:explore"
ctrl-c = "actions:cd"

[actions.explore]
description = "Open repository in a new terminal window with file manager runnign. Shell must have FILE_MANAGER variable"
command = "~/.config/television/shell-scripts/open-directory.nu {} --use-file-manager"
shell = "nu"
mode = "fork"

[actions.cd]
description = "Open a new terminal in the selected repository"
command = "~/.config/television/shell-scripts/open-directory.nu {}"
shell = "nu"
mode = "fork"

[actions.edit]
description = "Open repository in an editor in new terminal window."
command = "~/.config/television/shell-scripts/open-editor.nu {}"
shell = "nu"
mode = "fork"
