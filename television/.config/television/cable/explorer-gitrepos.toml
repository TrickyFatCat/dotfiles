[metadata]
name = "explorer-gitrepos"
requirements = ["fd", "eza"]
description = """
A channel to select from git repositories on your local machine as a project.

This channel uses
1. `fd` to find directories that contain a `.git` subdirectory.
2. `eza` to preview directory structure.
"""

[source]
# this is a macos version of the command. While perfectly usable on linux, you may want to tweak it a bit.
command = "fd -g .git -HL -t d -d 10 --prune ~ -E .cache -E .cargo -E .repos -E 'Library' -E 'Application Support' --exec dirname '{}'"
display = "{split:/:-1}"

[preview]
command = "eza -a -T -L 3 --git-ignore --color always --icons always '{}'"
shell = "nu"

[ui.remote_control]
disabled = true

[ui.preview_panel]
size = 55

[keybindings]
tab = "select_next_entry"
backtab = "select_prev_entry"
ctrl-j = "select_next_entry"
ctrl-k = "select_prev_entry"
q = "quit"
enter = "actions:edit"
ctrl-e = "actions:explore"
ctrl-c = "actions:cd"
ctrl-g = "actions:git"

[actions.explore]
description = "Open repository in a new terminal window with file manager runnign. Shell must have FILE_MANAGER variable"
command = "~/.config/television/shell-scripts/open-directory.nu {} --use-file-manager"
shell = "nu"
mode = "fork"

[actions.cd]
description = "Open a new terminal in the selected repository"
command = "~/.config/television/shell-scripts/open-directory.nu {}"
shell = "nu"
mode = "fork"

[actions.edit]
description = "Open repository in an editor in new terminal window."
command = "~/.config/television/shell-scripts/open-editor.nu {}"
shell = "nu"
mode = "fork"

[actions.git]
description = "Open repository in new terminal window wiht running git client."
command = "~/.config/television/shell-scripts/open-git.nu {}"
shell = "nu"
mode = "fork"
